name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements.txt }
      - run: pip install -r requirements.txt
      - run: python manage.py test
        working-directory: book_review_platform
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: book_review_platform/frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: book_review_platform/frontend/package-lock.json }
      - run: npm ci
      - run: npm test -- --watchAll=false
        env: { CI: "true" }
      - run: npm run build
        env: { CI: "true" }
